<svg viewBox="0 0 1000 1200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="strongGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <linearGradient id="mountainGradient1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#00ffff;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#00d9ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#6600ff;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="mountainGradient2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ff0066;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#6600ff;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="boltGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#00ffff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00ccff;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Outer white circle glow -->
  <circle cx="500" cy="380" r="280" fill="none" stroke="#ffffff" stroke-width="8" opacity="0.8" filter="url(#glow)"/>
  <circle cx="500" cy="380" r="270" fill="none" stroke="#ffffff" stroke-width="3" opacity="0.4"/>
  
  <!-- Inner cyan circle -->
  <circle cx="500" cy="380" r="240" fill="none" stroke="#00ffff" stroke-width="6" opacity="0.6" filter="url(#glow)"/>

  <!-- Top circuit lines and dots -->
  <g stroke="#00ffff" stroke-width="2" opacity="0.7" filter="url(#glow)">
    <!-- Center top -->
    <line x1="500" y1="110" x2="500" y2="160"/>
    <circle cx="500" cy="120" r="4" fill="#00ffff"/>
    
    <!-- Left top -->
    <line x1="380" y1="150" x2="410" y2="180"/>
    <circle cx="390" cy="160" r="3" fill="#00ffff"/>
    
    <!-- Right top -->
    <line x1="620" y1="150" x2="590" y2="180"/>
    <circle cx="610" cy="160" r="3" fill="#00ffff"/>
    
    <!-- Far left -->
    <line x1="240" y1="380" x2="300" y2="380"/>
    <circle cx="260" cy="380" r="4" fill="#00ffff"/>
    
    <!-- Far right -->
    <line x1="700" y1="380" x2="760" y2="380"/>
    <circle cx="740" cy="380" r="4" fill="#00ffff"/>
  </g>

  <!-- Top vertical circuit lines -->
  <g stroke="#00ffff" stroke-width="1.5" opacity="0.5" filter="url(#glow)">
    <line x1="420" y1="130" x2="420" y2="160"/>
    <line x1="440" y1="140" x2="440" y2="180"/>
    <line x1="460" y1="130" x2="460" y2="170"/>
    <line x1="540" y1="130" x2="540" y2="170"/>
    <line x1="560" y1="140" x2="560" y2="180"/>
    <line x1="580" y1="130" x2="580" y2="160"/>
  </g>

  <!-- Mountain outline - white stroke -->
  <path d="M 280 620 L 500 180 L 720 620 Z" fill="none" stroke="#ffffff" stroke-width="6" stroke-linejoin="round" filter="url(#strongGlow)"/>

  <!-- Left mountain fill (purple-pink gradient) -->
  <path d="M 280 620 L 500 180 L 500 620 Z" fill="url(#mountainGradient2)" opacity="0.85" filter="url(#glow)"/>

  <!-- Right mountain fill (cyan-purple gradient) -->
  <path d="M 500 180 L 720 620 L 500 620 Z" fill="url(#mountainGradient1)" opacity="0.85" filter="url(#glow)"/>

  <!-- Circuit lines on mountains -->
  <g stroke="#00ffff" stroke-width="2.5" opacity="0.7" filter="url(#glow)" stroke-linecap="round">
    <line x1="380" y1="330" x2="620" y2="330"/>
    <line x1="360" y1="380" x2="640" y2="380"/>
    <line x1="340" y1="430" x2="660" y2="430"/>
    <line x1="320" y1="480" x2="680" y2="480"/>
  </g>

  <!-- Small circuit connection dots on mountain -->
  <g fill="#00ffff" opacity="0.8" filter="url(#glow)">
    <circle cx="400" cy="330" r="2.5"/>
    <circle cx="600" cy="330" r="2.5"/>
    <circle cx="380" cy="380" r="2.5"/>
    <circle cx="620" cy="380" r="2.5"/>
    <circle cx="360" cy="430" r="2.5"/>
    <circle cx="640" cy="430" r="2.5"/>
    <circle cx="340" cy="480" r="2.5"/>
    <circle cx="660" cy="480" r="2.5"/>
  </g>

  <!-- Lightning bolt center -->
  <g fill="url(#boltGradient)" filter="url(#strongGlow)">
    <path d="M 510 280 L 440 410 L 480 410 L 450 560 L 560 380 L 530 380 Z" opacity="0.95" stroke="#ffffff" stroke-width="1.5"/>
  </g>

  <!-- Additional glow for lightning -->
  <g fill="none" stroke="#00ffff" stroke-width="1" opacity="0.4" filter="url(#glow)">
    <path d="M 510 280 L 440 410 L 480 410 L 450 560 L 560 380 L 530 380 Z"/>
  </g>

  <!-- Bottom circuit lines extending down -->
  <g stroke="#00ffff" stroke-width="1.5" opacity="0.5" filter="url(#glow)">
    <line x1="380" y1="620" x2="380" y2="680"/>
    <line x1="420" y1="620" x2="420" y2="700"/>
    <line x1="460" y1="620" x2="460" y2="690"/>
    <line x1="540" y1="620" x2="540" y2="690"/>
    <line x1="580" y1="620" x2="580" y2="700"/>
    <line x1="620" y1="620" x2="620" y2="680"/>
  </g>

  <!-- Bottom dots -->
  <g fill="#00ffff" opacity="0.6" filter="url(#glow)">
    <circle cx="380" cy="690" r="2"/>
    <circle cx="420" cy="710" r="2"/>
    <circle cx="460" cy="700" r="2"/>
    <circle cx="540" cy="700" r="2"/>
    <circle cx="580" cy="710" r="2"/>
    <circle cx="620" cy="690" r="2"/>
  </g>

  <!-- Text: SHIKHER SINGH -->
  <text x="500" y="950" font-family="Arial, sans-serif" font-size="120" font-weight="bold" text-anchor="middle" fill="#ffffff" letter-spacing="8" filter="url(#glow)">
    SHIKHER
  </text>
  <text x="500" y="1080" font-family="Arial, sans-serif" font-size="120" font-weight="bold" text-anchor="middle" fill="#ffffff" letter-spacing="8" filter="url(#glow)">
    SINGH
  </text>

  <!-- Decorative dots under text -->
  <g fill="#00ffff" opacity="0.7" filter="url(#glow)">
    <circle cx="280" cy="1120" r="3"/>
    <circle cx="720" cy="1120" r="3"/>
    <circle cx="350" cy="1130" r="2.5"/>
    <circle cx="650" cy="1130" r="2.5"/>
  </g>
</svg>
